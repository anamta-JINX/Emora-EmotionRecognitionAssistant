<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMORA | Feedback</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/ico" href="{{ url_for('static', filename='imgs/Elogo.ico') }}">
    <style>
        .inner-page {
            padding: 4rem 2rem;
            background: #FFF7E2;
        }

        .inner-container {
            max-width: 850px;
            margin: 0 auto;
        }

        .feedback-form {
            background: linear-gradient(145deg, rgba(255,255,255,0.72), rgba(255,247,226,0.96));
            border: 1px solid rgba(79,99,61,0.14);
            border-radius: 18px;
            padding: 2rem;
            box-shadow: 0 10px 24px rgba(27,33,26,0.08);
            margin-top: 2rem;
        }

        .feedback-form label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #1B211A;
        }

        .feedback-form input,
        .feedback-form select,
        .feedback-form textarea {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(79,99,61,0.22);
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            background: #fff;
        }

        .feedback-form textarea {
            min-height: 160px;
            resize: vertical;
        }

        .feedback-form button {
            background: linear-gradient(135deg, #4F633D 0%, #6C8454 100%);
            color: #FFF7E2;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .feedback-form button:hover {
            filter: brightness(1.05);
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-left">
        <div class="logo-wrapper">
            <img src="{{ url_for('static', filename='imgs/EmoralogoW.ico') }}"
                 alt="Emora Logo"
                 class="nav-logo">
        </div>
    </div>

    <ul class="nav-links">
        <li><a href="{{ url_for('index') }}">Index</a></li>
        <li><a href="{{ url_for('home') }}">Home</a></li>
        <li><a href="{{ url_for('team') }}">Team</a></li>
        <li><a href="{{ url_for('features') }}">Features</a></li>
        <li><a href="{{ url_for('research') }}">Research</a></li>
        <li><a href="{{ url_for('faq') }}">FAQ</a></li>
        <li><a href="{{ url_for('feedback') }}">Feedback</a></li>
    </ul>
</nav>

<section class="inner-page">
    <div class="inner-container">
        <h2 class="section-title">Share Your Feedback</h2>
        <p class="tech-intro">
            We’d love to hear suggestions, thoughts, or ideas that can help improve EMORA.
        </p>

        <form class="feedback-form" method="POST" action="#">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">

            <label for="type">Feedback Type</label>
            <select id="type" name="type">
                <option value="general">General Feedback</option>
                <option value="bug">Bug Report</option>
                <option value="feature">Feature Suggestion</option>
                <option value="research">Research Comment</option>
            </select>

            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Write your feedback here..."></textarea>

            <button type="submit">Submit Feedback</button>
        </form>
    </div>
</section>

<footer class="footer">
    <div class="footer-content">
        <p>&copy; 2026 EMORA. Designed for clarity, calm, and support.</p>
        <p>Crafted with care by <strong>Anamta & Eman</strong></p>
        <div class="footer-social">
            <a href="mailto:anamta.gohar25@gmail.com" title="Email Us">📧</a>
            <a href="https://github.com/anamta-JINX" target="_blank" title="GitHub">💻</a>
        </div>
    </div>
</footer>

</body>
</html>
